services:
  neverland-field-controller:
    restart: unless-stopped
    networks: [neverland_ot]
    expose:
      - "502"

  neverland-operator-console:
    restart: unless-stopped
    depends_on: [neverland-field-controller]
    networks: [neverland_ot]
    environment:
      - MODBUS_HOST=neverland-field-controller
      - MODBUS_PORT=502
      - MODBUS_SLAVE_ID=1
    expose:
      - "8080"

networks:
  neverland_ot:
    driver: bridge
